# /etc/nginx/conf.d/sapnhap.conf

# Rate limit zones
limit_req_zone $binary_remote_addr zone=sapnhap_api:20m rate=10r/s;
limit_req_zone $binary_remote_addr zone=sapnhap_dropdown:10m rate=2r/s;

# Connection limit zone
limit_conn_zone $binary_remote_addr zone=sapnhap_conn:10m;

server {
    listen 127.0.0.1:8083;
    server_name sapnhap.thinhpxp.io.vn;
    root /var/www/sapnhap;
    index index.html;

    # Real IP header from Cloudflare Tunnel
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;

    # Anti-Slowloris & Body Size Limit
    client_body_timeout    10s;
    client_header_timeout  10s;
    keepalive_timeout      30s;
    send_timeout           10s;
    client_max_body_size   16k;

    # Connection limit per IP
    limit_conn sapnhap_conn 20;
    limit_conn_status 429;

    # Return 444 for vulnerability scans or invalid Host headers
    if ($host !~* ^(sapnhap\.thinhpxp\.io\.vn)$) { return 444; }
    location ~* \.(php|asp|aspx|jsp|cgi)$ { return 444; }
    location ~* /(wp-admin|wp-login|phpmyadmin|xmlrpc) { return 444; }

    # Block automated crawlers & scrapers User-Agents
    if ($http_user_agent ~* (python|scrapy|curl|wget|postman|httpclient|java|go-http-client|axios|libwww-perl|nikto|sqlmap)) {
        return 403;
    }

    # Static assets long-term cache
    location ~* \.(css|js|png|jpg|jpeg|svg|webp|ico|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # Blog static pages (/blog/...)
    location /blog/ {
        try_files $uri $uri.html $uri/ /blog/index.html =404;
    }

    # Static HTML subpages (/vi/about.html, /en/about.html...)
    location ~* ^/(vi|en)/.+\.html$ {
        try_files $uri =404;
    }

    # Language SPA routes (/en, /en/, /vi, /vi/) -> fallback to React SPA index.html
    location ~* ^/(vi|en)/?$ {
        try_files /index.html =404;
    }

    # API Proxy to Fastify Docker Container
    location ~* ^/api/(new-geo-data|get-old-data|get-admin-centers) {
        limit_req zone=sapnhap_dropdown burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    location /api/ {
        limit_req zone=sapnhap_api burst=20 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Default SPA Fallback cho React App
    location / {
        try_files $uri $uri/ /index.html;
    }
}
