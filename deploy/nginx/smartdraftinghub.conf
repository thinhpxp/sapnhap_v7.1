# ============================================================
# [SEC-PLAN-2026-08] Phòng Thủ: Rate Limiting & Connection Limit
# ============================================================
# Vùng giới hạn kết nối đồng thời (chống Slowloris & WS Flood)
limit_conn_zone $binary_remote_addr zone=addr_conn_limit:10m;

# Vùng giới hạn tần suất request API chung: Tối đa 15 req/s per IP
limit_req_zone $binary_remote_addr zone=api_rate_limit:10m rate=15r/s;

# Vùng giới hạn nghiêm ngặt cho Auth (Login/Register): Tối đa 3 req/s per IP
limit_req_zone $binary_remote_addr zone=auth_rate_limit:10m rate=3r/s;

# Cấu hình cache cho WebSocket và Real-time Lock
# /etc/nginx/conf.d/
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 127.0.0.1:8082; # Chỉ nhận lưu lượng nội bộ từ Cloudflare Tunnel gửi tới
    server_name drafting.thinhpxp.io.vn;
    client_max_body_size 100M;

    # ============================================================
    # [SEC-PLAN-2026-08] Anti-Slowloris Timeouts
    # Ngắt nhanh các kết nối gửi Header/Body cực chậm để giữ ngâm socket
    # ============================================================
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Giới hạn số kết nối đồng thời tối đa từ 1 IP (áp dụng toàn server)
    limit_conn addr_conn_limit 20;

    # Cấu hình Real IP từ Cloudflare Tunnel
    real_ip_header CF-Connecting-IP;
    set_real_ip_from 127.0.0.1;

    # 1. Phục vụ file tĩnh hợp đồng .docx trực tiếp từ volume (Hiệu năng cực cao)
    location /media/ {
        alias /opt/smartdraftinghub/media/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
        access_log off;
    }

    # 2. Proxy lưu lượng WebSocket (Daphne ASGI Server) - Bắt buộc cho hệ thống LOCK hợp đồng
    # [SEC-PLAN-2026-08] Giới hạn 10 kết nối WS/IP để ngăn WS Connection Exhaustion
    location /ws/ {
        limit_conn addr_conn_limit 10;
        proxy_pass http://127.0.0.1:8000; # Cổng ngoài của container django-backend
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https; # Bắt buộc: Cloudflare Tunnel luôn là HTTPS
        proxy_read_timeout 86400s; # Giữ kết nối WebSocket không bị ngắt quãng
        proxy_send_timeout 86400s;
        # Khong ghi log chua token
        access_log off;
    }

    # 3a. Endpoint Đăng nhập: Rate Limit nghiêm ngặt (3 req/s, burst 5)
    # [SEC-PLAN-2026-08] Chống Brute-force Login & Credential Stuffing
    location /api/token/ {
        limit_req zone=auth_rate_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3b. Endpoint Đăng ký: Rate Limit nghiêm ngặt (3 req/s, burst 5)
    location /api/register/ {
        limit_req zone=auth_rate_limit burst=5 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 3c. Proxy APIs Backend (Django/Gunicorn/Daphne)
    # [SEC-PLAN-2026-08] Rate limit chung (15 req/s, burst 30) cho API nghiệp vụ
    location /api/ {
        limit_req zone=api_rate_limit burst=30 nodelay;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 4. Proxy Giao diện Admin Django
    location /django-admin/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }

    # 5. Proxy Frontend Vue 3 (Vite / Vue CLI web server)
    location / {
        proxy_pass http://127.0.0.1:8080; # Cổng ngoài của container vue-frontend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}

